name: RiskGuard AI Enterprise CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Lint & Typecheck
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Run Enterprise Regulatory & Security Test Harness
        run: npm test
