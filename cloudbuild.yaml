# ==============================================================================
# Google Cloud Build — CI/CD Pipeline for RiskGuard AI
# Builds image, verifies tests, pushes to Artifact Registry, and deploys to Cloud Run
# ==============================================================================
steps:
  # 1. Install dependencies and run complete test harness
  - name: 'node:22-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install
        npm run lint
        npm run build

  # 2. Build multi-stage container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/riskguard-repo/riskguard-ai:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/riskguard-repo/riskguard-ai:latest'
      - '.'

  # 3. Push container image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/riskguard-repo/riskguard-ai:$COMMIT_SHA'

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'riskguard-ai'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/riskguard-repo/riskguard-ai:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-secrets=GEMINI_API_KEY=riskguard-gemini-key:latest,AUDIT_HMAC_SECRET=riskguard-hmac-key:latest'
      - '--set-env-vars=NODE_ENV=production,PUBSUB_TOPIC=projects/$PROJECT_ID/topics/transactions-stream,BIGQUERY_DATASET=bfsi_lakehouse'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/riskguard-repo/riskguard-ai:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/riskguard-repo/riskguard-ai:latest'

substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
